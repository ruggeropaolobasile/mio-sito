<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#143e2b" />
  <title>DG Delivery — Reorder POC</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <div>
      <div class="eyebrow">REORDER POC</div>
      <h1 id="merchantName">DG Delivery</h1>
      <p id="tagline">Dettaglio e ingrosso di bevande</p>
    </div>
    <div class="same-day">Consegna in giornata</div>
  </header>

  <main>
    <section class="panel filters">
      <input id="search" type="search" placeholder="Cerca acqua, birra, Coca-Cola..." aria-label="Cerca prodotti" />
      <div id="categories" class="chips"></div>
    </section>

    <section class="section-head">
      <div>
        <h2>Catalogo</h2>
        <p id="catalogMeta" class="muted"></p>
      </div>
      <button id="reorderBtn" class="ghost hidden">Riordina l'ultimo</button>
    </section>

    <section id="products" class="grid"></section>
  </main>

  <aside id="cart" class="cart hidden" aria-live="polite">
    <div class="cart-head">
      <div><strong>Il tuo ordine</strong><div id="cartCount" class="muted"></div></div>
      <button id="closeCart" class="icon">×</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-total"><span>Totale</span><strong id="cartTotal">€0,00</strong></div>
    <div class="customer-grid">
      <input id="customerName" placeholder="Nome" autocomplete="name" />
      <input id="customerAddress" placeholder="Indirizzo di consegna" autocomplete="street-address" />
      <select id="slot">
        <option value="Oggi - prima fascia disponibile">Oggi - prima fascia disponibile</option>
        <option value="Oggi 16:00-18:00">Oggi 16:00-18:00</option>
        <option value="Domani mattina">Domani mattina</option>
      </select>
      <textarea id="notes" placeholder="Note (citofono, piano, sostituzioni...)"></textarea>
    </div>
    <button id="checkout" class="primary">Prepara ordine WhatsApp</button>
    <p class="fineprint">POC dimostrativo: nessun ordine viene inviato automaticamente.</p>
  </aside>

  <button id="openCart" class="fab hidden"><span id="fabCount">0</span> Apri ordine</button>

  <template id="productTpl">
    <article class="card">
      <div class="category"></div>
      <h3></h3>
      <div class="format muted"></div>
      <div class="row"><strong class="price"></strong><button class="add">Aggiungi</button></div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
